<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

    <defs>

        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1E3A8A"/>
            <stop offset="55%" stop-color="#4F46E5"/>
            <stop offset="100%" stop-color="#7C3AED"/>
        </linearGradient>

        <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8BE9FF"/>
            <stop offset="100%" stop-color="#D8B4FE"/>
        </linearGradient>

        <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="white" stop-opacity=".28"/>
            <stop offset="100%" stop-color="white" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="text" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#E0E7FF"/>
        </linearGradient>

        <filter id="shadow"
                x="-30%" y="-30%"
                width="160%" height="160%">
            <feDropShadow dx="0"
                          dy="10"
                          stdDeviation="12"
                          flood-color="#000"
                          flood-opacity=".35"/>

            <feDropShadow dx="0"
                          dy="0"
                          stdDeviation="10"
                          flood-color="#60A5FA"
                          flood-opacity=".35"/>
        </filter>

    </defs>

    <!-- Outer Glow -->
    <polygon
        points="256,40 472,256 256,472 40,256"
        fill="#60A5FA"
        opacity=".08"
        filter="url(#shadow)"/>

    <!-- Main Shape -->
    <polygon
        points="256,56 456,256 256,456 56,256"
        fill="url(#bg)"
        stroke="url(#border)"
        stroke-width="8"
        filter="url(#shadow)"/>

    <!-- Glass -->
    <path
        d="M256 56
           L456 256
           L356 256
           Q256 170 156 256
           L56 256
           Z"
        fill="url(#glass)"/>

    <!-- Question Mark -->
    <text
        x="256"
        y="315"
        text-anchor="middle"
        font-size="210"
        font-family="Segoe UI Variable, Segoe UI, Arial"
        font-weight="700"
        fill="url(#text)">
        ?
    </text>

</svg>