<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2C3240"/>
      <stop offset="100%" stop-color="#171A22"/>
    </linearGradient>

    <linearGradient id="diamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE28A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5"
                    flood-color="#000"
                    flood-opacity=".30"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>

  </defs>

  <!-- Card -->
  <rect x="2"
        y="2"
        width="60"
        height="60"
        rx="14"
        fill="url(#bg)"
        filter="url(#shadow)"/>

  <!-- Diamond glow -->
  <rect x="11"
        y="27"
        width="10"
        height="10"
        rx="2"
        transform="rotate(45 16 32)"
        fill="#FBBF24"
        opacity=".25"
        filter="url(#glow)"/>

  <!-- Diamond -->
  <rect x="11"
        y="27"
        width="10"
        height="10"
        rx="2"
        transform="rotate(45 16 32)"
        fill="url(#diamond)"/>

  <!-- Highlight -->
  <path d="M16 27 L19 30"
        stroke="#FFF8D6"
        stroke-width="1"
        stroke-linecap="round"
        opacity=".7"/>

  <!-- Connector -->
  <path d="M21 32H36"
        stroke="#C8CDD7"
        stroke-width="2.2"
        stroke-linecap="round"/>

  <path d="M36 22V42"
        stroke="#C8CDD7"
        stroke-width="2.2"
        stroke-linecap="round"/>

  <path d="M36 22H47"
        stroke="#C8CDD7"
        stroke-width="2.2"
        stroke-linecap="round"/>

  <path d="M36 32H47"
        stroke="#C8CDD7"
        stroke-width="2.2"
        stroke-linecap="round"/>

  <path d="M36 42H47"
        stroke="#C8CDD7"
        stroke-width="2.2"
        stroke-linecap="round"/>

  <!-- IF -->
  <circle cx="50"
          cy="22"
          r="3.2"
          fill="#22C55E"/>

  <!-- ELSE IF -->
  <rect x="46.8"
        y="28.8"
        width="6.4"
        height="6.4"
        rx="1.6"
        fill="#F97316"/>

  <!-- ELSE -->
  <rect x="47"
        y="39"
        width="6"
        height="6"
        rx="1"
        transform="rotate(45 50 42)"
        fill="#8B5CF6"/>

</svg>