<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

    <defs>

        <!-- Background -->
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00121F"/>
            <stop offset="35%" stop-color="#032B48"/>
            <stop offset="100%" stop-color="#00588D"/>
        </linearGradient>

        <!-- Inner Light -->
        <radialGradient id="light"
                         cx="25%"
                         cy="20%"
                         r="80%">
            <stop offset="0%" stop-color="#1BCFFF" stop-opacity=".35"/>
            <stop offset="70%" stop-color="#1BCFFF" stop-opacity="0"/>
        </radialGradient>

        <!-- Border -->
        <linearGradient id="border"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">
            <stop offset="0%" stop-color="#6EEBFF"/>
            <stop offset="50%" stop-color="#22C7FF"/>
            <stop offset="100%" stop-color="#007DFF"/>
        </linearGradient>

        <!-- Text -->
        <linearGradient id="text"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%" stop-color="#D8FFFF"/>
            <stop offset="45%" stop-color="#88E8FF"/>
            <stop offset="100%" stop-color="#35BFFF"/>
        </linearGradient>

        <!-- Glass -->
        <linearGradient id="glass"
                        x1="0%"
                        y1="0%"
                        x2="0%"
                        y2="100%">
            <stop offset="0%" stop-color="white" stop-opacity=".18"/>
            <stop offset="100%" stop-color="white" stop-opacity="0"/>
        </linearGradient>

        <!-- Shadow -->
        <filter id="shadow"
                x="-30%"
                y="-30%"
                width="160%"
                height="160%">

            <feDropShadow dx="0"
                          dy="10"
                          stdDeviation="10"
                          flood-color="#000"
                          flood-opacity=".45"/>

            <feDropShadow dx="0"
                          dy="0"
                          stdDeviation="12"
                          flood-color="#25D3FF"
                          flood-opacity=".30"/>

        </filter>

        <!-- Glow -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>

    <!-- Outer Glow -->
    <rect
        x="28"
        y="28"
        width="456"
        height="456"
        rx="96"
        fill="#12CFFF"
        opacity=".08"
        filter="url(#glow)"/>

    <!-- Background -->
    <rect
        x="36"
        y="36"
        width="440"
        height="440"
        rx="88"
        fill="url(#bg)"
        stroke="url(#border)"
        stroke-width="7"
        filter="url(#shadow)"/>

    <!-- Light -->
    <rect
        x="36"
        y="36"
        width="440"
        height="440"
        rx="88"
        fill="url(#light)"/>

    <!-- Glass -->
    <path
        d="
        M60 60
        H452
        V180
        C330 130 190 130 60 180
        Z"
        fill="url(#glass)"/>

    <!-- Decorative corner -->
    <circle
        cx="410"
        cy="102"
        r="22"
        fill="#62E6FF"
        opacity=".15"/>

    <circle
        cx="392"
        cy="118"
        r="8"
        fill="#A6F5FF"
        opacity=".55"/>

    <!-- Ps -->
    <text
        x="108"
        y="324"
        font-size="210"
        font-family="Segoe UI Variable, Segoe UI, Arial, sans-serif"
        font-weight="700"
        letter-spacing="-10"
        fill="url(#text)"
        filter="url(#shadow)">
        Ps
    </text>

</svg>