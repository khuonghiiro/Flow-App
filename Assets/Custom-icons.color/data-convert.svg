<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4F8EF7"/>
            <stop offset="100%" stop-color="#2DD4BF"/>
        </linearGradient>

        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect x="4" y="4" width="56" height="56" rx="14"
          fill="#1E293B"
          filter="url(#shadow)"/>

    <!-- Input Object -->
    <rect x="10" y="18" width="14" height="28" rx="3"
          fill="#334155"
          stroke="#60A5FA"
          stroke-width="1.5"/>

    <text x="17" y="36"
          font-family="Consolas, monospace"
          font-size="10"
          text-anchor="middle"
          fill="#60A5FA">{ }</text>

    <!-- Convert -->
    <path d="M28 24 L38 24 L35 21 M38 24 L35 27"
          stroke="url(#grad)"
          stroke-width="2.5"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <path d="M38 40 L28 40 L31 37 M28 40 L31 43"
          stroke="url(#grad)"
          stroke-width="2.5"
          fill="none"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Output Types -->
    <rect x="42" y="12" width="12" height="10" rx="2"
          fill="#22C55E"/>

    <rect x="42" y="27" width="12" height="10" rx="2"
          fill="#F59E0B"/>

    <circle cx="48" cy="47" r="5"
            fill="#EC4899"/>

    <!-- Small symbols -->
    <text x="48" y="19"
          font-size="7"
          text-anchor="middle"
          fill="white">{}</text>

    <text x="48" y="34"
          font-size="7"
          text-anchor="middle"
          fill="white">[]</text>

    <text x="48" y="50"
          font-size="6"
          text-anchor="middle"
          fill="white">A</text>
</svg>