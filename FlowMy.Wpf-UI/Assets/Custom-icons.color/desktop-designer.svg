<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64">

    <defs>

        <linearGradient id="bg"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
            <stop offset="0%" stop-color="#2563EB"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
        </linearGradient>

        <linearGradient id="window"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#E5E7EB"/>
        </linearGradient>

        <linearGradient id="accent"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="1">
            <stop offset="0%" stop-color="#34D399"/>
            <stop offset="100%" stop-color="#10B981"/>
        </linearGradient>

        <filter id="shadow">
            <feDropShadow dx="0"
                          dy="2"
                          stdDeviation="2"
                          flood-opacity=".25"/>
        </filter>

    </defs>

    <!-- Background -->
    <rect
        x="2"
        y="2"
        width="60"
        height="60"
        rx="14"
        fill="url(#bg)"
        filter="url(#shadow)"/>

    <!-- Window -->
    <rect
        x="10"
        y="12"
        width="44"
        height="36"
        rx="4"
        fill="url(#window)"/>

    <!-- Title Bar -->
    <rect
        x="10"
        y="12"
        width="44"
        height="7"
        rx="4"
        fill="#CBD5E1"/>

    <circle cx="15" cy="15.5" r="1" fill="#EF4444"/>
    <circle cx="18" cy="15.5" r="1" fill="#F59E0B"/>
    <circle cx="21" cy="15.5" r="1" fill="#22C55E"/>

    <!-- Controls -->
    <rect x="15" y="24" width="10" height="8" rx="2" fill="#60A5FA"/>

    <rect x="30" y="24" width="18" height="4" rx="2" fill="#94A3B8"/>

    <rect x="15" y="36" width="18" height="4" rx="2" fill="#94A3B8"/>

    <rect x="38" y="34" width="10" height="10" rx="2" fill="url(#accent)"/>

    <!-- Dynamic Spark -->
    <path
        d="M48 46
           L49.5 42
           L51 46
           L55 47.5
           L51 49
           L49.5 53
           L48 49
           L44 47.5
           Z"
        fill="#FACC15"/>

</svg>