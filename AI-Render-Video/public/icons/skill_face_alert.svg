<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="10" fill="#1b0819"/>
  <!-- Sharp vigilant eye looking sideways back -->
  <path d="M12 24C16 17 32 17 36 24C32 31 16 31 12 24Z" stroke="#f472b6" stroke-width="2.5" fill="#2d0a27"/>
  <!-- Narrow slit sharp pupil scanning left/back -->
  <ellipse cx="20" cy="24" rx="4" ry="5.5" fill="#ec4899"/>
  <circle cx="18" cy="23" r="1.5" fill="#ffffff"/>
  <!-- Sharp brow furrow -->
  <path d="M10 16C15 13 22 14 26 17" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Danger radar ping -->
  <path d="M38 12C41 15 42 19 41 23" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3"/>
</svg>
