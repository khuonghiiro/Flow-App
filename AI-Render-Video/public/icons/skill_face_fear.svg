  <circle cx="17" cy="22" r="1.5" fill="#ffffff"/>
  <circle cx="31" cy="22" r="5" stroke="#f472b6" stroke-width="2" fill="#2d0a27"/>
  <circle cx="31" cy="22" r="1.5" fill="#ffffff"/>
