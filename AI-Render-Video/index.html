<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><circle cx='12' cy='12' r='10'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 3D Animation Studio | Master Orchestrator</title>
    <!-- Global Error Handler -->
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:9999;background:red;color:white;padding:20px;font-family:monospace;font-size:16px;width:100%;"><h3>Global Error (Module Load Failure):</h3><pre>' + (e.error ? e.error.stack : e.message) + '</pre></div>';
      });
    </script>
    <!-- Local Self-hosted Fonts (zero latency, offline-ready) -->
    <link rel="stylesheet" href="/css/fonts.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Instant splash screen — shown while JS modules load -->
    <div id="splash" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b0d14;color:#f8fafc;font-family:system-ui,sans-serif;gap:16px">
      <div style="width:36px;height:36px;border:3px solid rgba(99,102,241,0.2);border-top-color:#6366f1;border-radius:50%;animation:sp .8s linear infinite"></div>
      <div style="font-size:13px;font-weight:600;letter-spacing:0.5px;opacity:0.7">FlowMy AI Studio</div>
      <style>@keyframes sp{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
